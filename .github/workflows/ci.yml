name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Falla con avisos altos en lo que va a producción; el resto lo propone Dependabot.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint:deps
      - run: npm run lint:unused
      - run: npm run contract:check
      - run: npm run test:coverage

  # La imagen de ADR-0007 construye, arranca y responde /health (valores de relleno:
  # /health no toca la base).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fitogenix-server .
      - run: |
          docker run -d --name server -p 3000:3000 \
            -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_SECRET_KEY=ci \
            fitogenix-server
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs server
          exit 1

  # Todas las migraciones sobre una base vacía (R-05): una que se rompa, o que abra datos a
  # anon/authenticated o deje una tabla sin RLS, frena el merge.
  migraciones:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase db start
      - name: Guardián de permisos
        run: |
          problemas=$(psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -tA -f supabase/tests/permisos.sql)
          if [ -n "$problemas" ]; then echo "$problemas"; exit 1; fi
